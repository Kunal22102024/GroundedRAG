# Development override: the backend runs from the mounted source and reloads on change.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml exec backend pytest
#
# Still ONE worker (CLAUDE.md rule 4): --reload restarts that single worker when a file changes.
# `eval/` is mounted so `python -m eval.run_eval` works inside the container.
services:
  backend:
    volumes:
      - ./backend:/app
      - ./eval:/app/eval:ro
      - uploads:/data/uploads
    entrypoint:
      - sh
      - -c
      - >-
        alembic upgrade head &&
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000
        --no-access-log --no-server-header --reload --reload-dir /app/app

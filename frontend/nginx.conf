# nginx for GroundedRAG: serves the SPA, proxies /api to the backend, keeps the chat SSE stream
# unbuffered, and puts the first limits in front of the backend (request sizes, request rates and
# the sign-in check for uploads). Runs as an unprivileged user on port 8080.
#
# This file is loaded inside nginx's http {} block, so the zones and maps below are allowed here.

# --- Request rates ------------------------------------------------------------------------------
# One bucket per client address. Behind Docker Desktop every client can look like one address, so
# the numbers are generous: they stop a script, not a busy office.
limit_req_status 429;
limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;  # login/signup guessing
limit_req_zone $binary_remote_addr zone=chat:10m rate=60r/m;  # each question costs LLM calls
limit_req_zone $binary_remote_addr zone=analysis:10m rate=20r/m;  # summaries, extraction, comparison
# Only uploads (POST) are counted; listing documents (GET, polled while indexing) is not.
map $request_method $upload_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $upload_key zone=upload:10m rate=20r/m;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # The ceiling for any request body. Routes that legitimately carry more, or that should carry
    # much less, say so below. nginx buffers a body before the backend sees it, so a large
    # ceiling on a route that does not need it is memory and disk for anyone who can reach it.
    client_max_body_size 1m;

    include snippets/security-headers.conf;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Re-resolve the backend through Docker's DNS so recreating the backend
    # container does not leave nginx pointing at a stale IP. A variable in
    # proxy_pass makes nginx honor this resolver and forwards the URI unchanged.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    # --- Errors nginx produces itself, as JSON like the API's own -----------------------------------
    error_page 401 = @unauthorized;
    error_page 413 = @too_large;
    error_page 429 = @too_many_requests;

    location @unauthorized {
        include snippets/security-headers.conf;
        default_type application/json;
        add_header WWW-Authenticate "Bearer" always;
        return 401 '{"detail":"Not authenticated"}';
    }
    location @too_large {
        include snippets/security-headers.conf;
        default_type application/json;
        return 413 '{"detail":"The request is too large. Send fewer or smaller files."}';
    }
    location @too_many_requests {
        include snippets/security-headers.conf;
        default_type application/json;
        add_header Retry-After "10" always;
        return 429 '{"detail":"Too many requests. Please wait a moment and try again."}';
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- API ------------------------------------------------------------------------------------------

    # Server-Sent Events: stream tokens to the browser as they are produced.
    location = /api/chat {
        limit_req zone=chat burst=30 nodelay;
        client_max_body_size 64k;  # a question is at most a few thousand characters
        proxy_pass $backend;
        include snippets/proxy-common.conf;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
    }

    # Summaries, extraction and comparison: also Server-Sent Events, and slower than a chat turn
    # (a long document is read in several model calls), so the same unbuffered proxy with a rate
    # limit of its own: every request here costs at least one LLM call.
    location /api/analysis/ {
        limit_req zone=analysis burst=10 nodelay;
        client_max_body_size 64k;  # a few field names or a question
        proxy_pass $backend;
        include snippets/proxy-common.conf;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
    }

    # Sign-up and sign-in: small bodies, and a limit on how fast passwords can be tried.
    location /api/auth/ {
        limit_req zone=auth burst=20 nodelay;
        client_max_body_size 32k;
        proxy_pass $backend;
        include snippets/proxy-common.conf;
        proxy_read_timeout 60s;
    }

    # The one route that takes large bodies. The sign-in is checked BEFORE the body is read:
    # without that, anyone who can reach the server could make it buffer 256 MB per request.
    # (Per-file size and the number of files are enforced by the backend afterwards.)
    location = /api/documents {
        auth_request /_auth;
        limit_req zone=upload burst=10 nodelay;
        client_max_body_size 256m;
        proxy_pass $backend;
        include snippets/proxy-common.conf;
        proxy_read_timeout 300s;
    }
    location = /_auth {
        internal;
        # The subrequest copies the client's Content-Length but never reads the body
        # (proxy_pass_request_body off); the default 1m limit would turn every upload over
        # 1 MB into a 500 before the sign-in is even looked at.
        client_max_body_size 0;
        proxy_pass $backend/api/auth/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /api/ {
        proxy_pass $backend;
        include snippets/proxy-common.conf;
        proxy_read_timeout 120s;
    }

    # --- The single-page app ------------------------------------------------------------------------

    # index.html names the hashed bundle files. If a browser keeps an old copy after a redeploy it
    # asks for bundle files that no longer exist, so it must always be revalidated.
    location = /index.html {
        include snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Bundle files are named by their content hash and never change. A missing one is a 404, never
    # index.html (which a browser would refuse to run as a script and show a blank page).
    location /assets/ {
        include snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Unknown paths fall back to index.html (client-side routes such as /chat/<id>).
    location / {
        try_files $uri $uri/ /index.html;
    }
}

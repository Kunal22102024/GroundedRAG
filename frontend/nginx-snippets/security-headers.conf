# Headers for every response. nginx does not inherit add_header into a location that declares its
# own, so locations that add a header (cache control, error bodies) include this file again.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
# The source drawer embeds the original PDF from this same origin.
add_header X-Frame-Options "SAMEORIGIN" always;
# The sign-in token lives in localStorage, so a script that ran here could read it. script-src
# 'self' means only the bundle served from this origin runs (no inline or injected script).
# The PDF drawer shows a blob: URL in an iframe: frame-src and object-src allow blob:, and a
# blob document inherits this policy. If a browser refuses to show the PDF, relax object-src
# first. (style-src keeps 'unsafe-inline' for the PDF viewer's own wrapper page.)
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'self' blob:; frame-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

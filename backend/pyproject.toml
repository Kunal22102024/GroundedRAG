[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = [
    "ignore:legacy embedding function config:DeprecationWarning",  # chromadb-client internals
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# The formatter wraps code at 100; comments and long strings are not worth contorting.
ignore = ["E501"]
